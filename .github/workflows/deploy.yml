name: 🚀 Deploy Calker

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout do Código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📝 Criar .env.production (Frontend)
        run: |
          cd frontend
          # Se VITE_API_URL não estiver definido, deixa vazio (usa '/api' como fallback)
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env.production

      - name: 🏗️ Build do Frontend (No GitHub)
        run: |
          cd frontend
          npm install
          npm run build 

      - name: 📦 Enviar Frontend (dist) via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "frontend/dist/"
          target: "/var/www/app/calker/frontend/dist/"

      - name: ⚡ Atualizar e Buildar Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # Entrar na pasta do projeto
            cd /var/www/app/calker
            
            echo "📥 Puxando código novo do Git..."
            git pull origin ${{ github.ref_name }}

            echo "⚙️ Configurando Backend..."
            cd backend
            
            export NODE_OPTIONS="--max-old-space-size=400"
            
            echo "📦 Instalando dependências..."
            npm install
            
            echo "🏗️ Compilando TypeScript..."
            npm run build
            
            echo "🔄 Reiniciando PM2..."
            pm2 restart api --update-env || pm2 start dist/index.js --name api
            pm2 save